{% extends "worksheets/base.html" %}

{% block nav %}{% endblock %}

{% block content %}
  <h1>Worksheet generator</h1>
  <p>Pick the kind of worksheet to make.</p>

  {% for builder in builders %}
  <section>
    <h2><a href="{% url builder.url_name %}">{{ builder.title }}</a></h2>
    <p>{{ builder.description }}</p>
  </section>
  {% endfor %}
{% endblock %}
