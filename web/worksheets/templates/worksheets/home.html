{% extends "base.html" %}

{% block content %}
  <h1>Worksheet generator</h1>
  <p>Pick the kind of worksheet to make.</p>

  <div class="cards">
    {% for group in catalogue %}
    <a href="{% url group.sheets.0.url_name %}" class="card">
      <h2>{{ group.title }}</h2>
      <p>{{ group.description }}</p>
    </a>
    {% endfor %}
  </div>
{% endblock %}
