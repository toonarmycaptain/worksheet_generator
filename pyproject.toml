[project]
name = "worksheet-generator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "django-ninja>=1.7.1",
    "jinja2==3.1.6",
    "numpy==2.5.3",
    "reportlab>=5.0.1",
    "weasyprint==70.0",
]

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "mypy==2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mypy==1.0.1",
    "ruff>=0.17.0",
]


[tool.pytest.ini_options]
addopts = "--doctest-modules"

[tool.mypy]
strict = true
files = ["worksheet_generator", "tests"]

[[tool.mypy.overrides]]
module = ["weasyprint.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "worksheet_generator._imported.*"
ignore_errors = true

[tool.coverage.run]
source = ["worksheet_generator"]

[tool.ruff]
line-length = 100
extend-exclude = ["worksheet_generator/_imported"]
force-exclude = true

[tool.ruff.lint]
select = [
      "E", "W",   # pycodestyle
      "F",        # pyflakes
      "I",        # import sorting
      "UP",       # pyupgrade (modern syntax for 3.13)
      "B",        # bugbear
      "SIM",      # simplifications
      "RUF",      # ruff-specific
  ]
