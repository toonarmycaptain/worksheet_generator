[project]
name = "worksheet-generator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "django-ninja>=1.7.1",
    "jinja2==3.1.6",
    "numpy==2.5.3",
    "weasyprint==70.0",
]

[dependency-groups]
dev = [
    "codacy-coverage==1.3.11",
    "coverage==7.16.2",
    "mypy==2.3.1",
    "pytest-cov==7.1.0",
    "pytest-mypy==1.0.1",
    "urllib3>=2.8.0",
]
